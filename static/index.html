<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecOps Copilot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #0a0d13;
    --panel: #12161f;
    --panel-2: #171c27;
    --border: #232a38;
    --border-soft: #1a2029;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --muted-dim: #5a6270;
    --accent: #4fd1c5;
    --accent-soft: #3ab8ac;
    --accent-dim: #16302d;
    --user-bubble: #16302d;
    --danger: #f47174;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(79, 209, 197, 0.05), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(79, 209, 197, 0.03), transparent 40%),
      var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--border-soft);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent-dim), #0e211f);
    border: 1px solid var(--accent-soft);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .brand-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .badge {
    font-size: 11.5px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px 5px 10px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-dim); }
  .dot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.err { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }

  main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .thread {
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 28px 20px 32px;
  }
  .thread.centered {
    flex: 1;
    justify-content: center;
    padding-bottom: 10vh;
  }

  .empty-state { text-align: center; color: var(--muted); }
  .empty-icon {
    width: 52px; height: 52px;
    margin: 0 auto 18px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-dim), #0e211f);
    border: 1px solid var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .empty-state h2 { color: var(--text); font-size: 19px; margin: 0 0 8px; font-weight: 600; }
  .empty-state p { font-size: 13.5px; max-width: 420px; margin: 0 auto 26px; line-height: 1.55; color: var(--muted); }
  .examples {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto;
  }
  @media (max-width: 620px) { .examples { grid-template-columns: 1fr; } }
  .example-btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 15px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    line-height: 1.45;
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
  }
  .example-btn:hover { border-color: var(--accent-soft); background: var(--panel-2); transform: translateY(-1px); }
  .example-btn::before { content: "＋ "; color: var(--accent); }

  .msg { display: flex; gap: 12px; animation: rise 0.25s ease; }
  .msg.user { justify-content: flex-end; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
    background: var(--panel-2); border: 1px solid var(--border);
  }
  .msg-body { max-width: 76%; }
  .msg.user .msg-body {
    background: var(--user-bubble);
    border: 1px solid #204742;
    border-radius: 16px 16px 4px 16px;
    padding: 11px 16px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg.assistant .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px 16px 16px 4px;
    padding: 16px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .msg.assistant .bubble.error { border-color: var(--danger); }
  .answer-text { font-size: 14.5px; line-height: 1.65; }
  .answer-text p { margin: 0 0 10px; }
  .answer-text p:last-child { margin-bottom: 0; }
  .answer-text code { background: #0e1219; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .answer-text ul, .answer-text ol { margin: 6px 0; padding-left: 20px; }

  .meta-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; font-size: 11px; color: var(--muted-dim);
  }
  .meta-row .sep { opacity: 0.5; }
  .icon-btn {
    background: none; border: none; color: var(--muted-dim);
    cursor: pointer; font-size: 11px; padding: 2px 4px; margin-left: auto;
  }
  .icon-btn:hover { color: var(--accent); }

  .trace { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .trace-toggle {
    background: none; border: none; color: var(--muted);
    font-size: 12px; cursor: pointer; padding: 0;
    display: flex; align-items: center; gap: 6px;
  }
  .trace-toggle:hover { color: var(--text); }
  .trace-list { margin-top: 8px; display: none; flex-direction: column; gap: 6px; }
  .trace-list.open { display: flex; }
  .tool-call {
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 7px;
    padding: 9px 11px;
    font-size: 12.5px;
    background: var(--panel-2);
  }
  .tool-name { color: var(--accent); font-weight: 600; }
  .tool-input { color: var(--muted); margin-top: 3px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; word-break: break-word; }

  .typing { display: flex; gap: 4px; padding: 3px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out; opacity: 0.4;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  footer {
    padding: 18px 20px 22px;
    display: flex;
    justify-content: center;
  }
  .composer-wrap { width: 100%; max-width: 780px; }
  .composer {
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 8px 8px 8px 18px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .composer:focus-within { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.08); }
  textarea#question {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    background: transparent;
    color: var(--text);
    border: none;
    padding: 10px 0;
    font-size: 14.5px;
    font-family: inherit;
    resize: none;
    max-height: 140px;
    line-height: 1.4;
  }
  textarea#question:focus { outline: none; }
  textarea#question::placeholder { color: var(--muted-dim); }
  button.send {
    background: var(--accent);
    color: #05201d;
    border: none;
    border-radius: 12px;
    width: 40px; height: 40px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  button.send:hover:not(:disabled) { background: var(--accent-soft); transform: translateY(-1px); }
  button.send:disabled { opacity: 0.35; cursor: default; }
  .hint { text-align: center; font-size: 10.5px; color: var(--muted-dim); margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">🛡️</div>
    <div>
      <div class="brand-title">SecOps Copilot</div>
      <div class="brand-sub">RAG + tool-calling agent for security operations</div>
    </div>
  </div>
  <div class="header-right">
    <button class="ghost" id="clearBtn">Clear chat</button>
  </div>
</header>

<main><div class="thread centered" id="thread">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">🛡️</div>
    <h2>Ask it something a SOC analyst would actually ask</h2>
    <p>It'll decide which tools to call — runbook search, indicator lookup, or severity policy — and cite what it used.</p>
    <div class="examples" id="examples"></div>
  </div>
</div></main>

<footer>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="question" placeholder="Ask a security-operations question…" rows="1"></textarea>
      <button class="send" id="sendBtn" title="Send">➤</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</footer>

<script>
const EXAMPLES = [
  "A user entered their password on a phishing page — what do I do?",
  "How fast do we need to patch a critical CVE on an internet-facing server?",
  "Is secure-login-verify.net a known bad domain?",
  "DLP flagged someone sending customer SSNs to their personal Gmail.",
];

const thread = document.getElementById("thread");
const emptyState = document.getElementById("emptyState");
const examplesEl = document.getElementById("examples");
const questionEl = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");

EXAMPLES.forEach((ex) => {
  const btn = document.createElement("button");
  btn.className = "example-btn";
  btn.textContent = ex;
  btn.onclick = () => { questionEl.value = ex; send(); };
  examplesEl.appendChild(btn);
});

function autoResize() {
  questionEl.style.height = "auto";
  questionEl.style.height = Math.min(questionEl.scrollHeight, 140) + "px";
}
questionEl.addEventListener("input", autoResize);
questionEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);
clearBtn.addEventListener("click", () => {
  thread.innerHTML = "";
  thread.classList.add("centered");
  thread.appendChild(emptyState);
});

function uncenter() {
  thread.classList.remove("centered");
  if (emptyState.parentNode) emptyState.remove();
}

function addUserMessage(text) {
  uncenter();
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="msg-body">${escapeHtml(text)}</div>`;
  thread.appendChild(el);
  scrollDown();
}

function addTypingIndicator() {
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.id = "typing-indicator";
  el.innerHTML = `<div class="msg-avatar">🛡️</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  thread.appendChild(el);
  scrollDown();
}

function removeTypingIndicator() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function addAssistantMessage(data, elapsed) {
  const el = document.createElement("div");
  el.className = "msg assistant";
  const rendered = window.marked ? marked.parse(data.answer) : escapeHtml(data.answer);

  let traceHtml = "";
  if (data.tool_calls && data.tool_calls.length > 0) {
    traceHtml = `
      <div class="trace">
        <button class="trace-toggle" onclick="this.nextElementSibling.classList.toggle('open')">
          ▸ ${data.tool_calls.length} tool call${data.tool_calls.length > 1 ? "s" : ""}
        </button>
        <div class="trace-list">
          ${data.tool_calls.map(tc => `
            <div class="tool-call">
              <div class="tool-name">${escapeHtml(tc.name)}</div>
              <div class="tool-input">${escapeHtml(JSON.stringify(tc.input))}</div>
            </div>`).join("")}
        </div>
      </div>`;
  }

  el.innerHTML = `
    <div class="msg-avatar">🛡️</div>
    <div class="bubble">
      <div class="answer-text">${rendered}</div>
      ${traceHtml}
      <div class="meta-row">
        <span>${elapsed}s</span>
        <span class="sep">·</span>
        <span>${data.steps_used} step${data.steps_used > 1 ? "s" : ""}</span>
        ${data.model ? `<span class="sep">·</span><span>${escapeHtml(data.model)}</span>` : ""}
        <button class="icon-btn" onclick="copyAnswer(this)" data-text="${encodeURIComponent(data.answer)}">copy</button>
      </div>
    </div>`;
  thread.appendChild(el);
  scrollDown();
}

function addErrorMessage(message) {
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.innerHTML = `<div class="msg-avatar">⚠️</div><div class="bubble error"><span style="color: var(--danger)">${escapeHtml(message)}</span></div>`;
  thread.appendChild(el);
  scrollDown();
}

async function send() {
  const question = questionEl.value.trim();
  if (!question) return;

  addUserMessage(question);
  questionEl.value = "";
  autoResize();
  sendBtn.disabled = true;
  addTypingIndicator();

  const started = performance.now();
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    removeTypingIndicator();

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${res.status})`);
    }

    const data = await res.json();
    const elapsed = ((performance.now() - started) / 1000).toFixed(1);
    addAssistantMessage(data, elapsed);
  } catch (err) {
    removeTypingIndicator();
    addErrorMessage(err.message || "Something went wrong talking to the backend.");
  } finally {
    sendBtn.disabled = false;
  }
}

function copyAnswer(btn) {
  const text = decodeURIComponent(btn.dataset.text);
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = "copied";
    setTimeout(() => { btn.textContent = original; }, 1200);
  });
}

function scrollDown() {
  requestAnimationFrame(() => {
    const m = document.querySelector("main");
    m.scrollTop = m.scrollHeight;
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
